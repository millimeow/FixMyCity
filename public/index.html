<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185346" />
    <meta
      name="description"
      content="Report civic issues across Mumbai. Follow progress, support your community and help make your neighbourhood better."
    />
    <title>Fix My City — Better streets, together</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <aside class="sidebar" id="sidebar">
      <button
        id="close-menu"
        class="icon-button mobile-only close-menu"
        aria-label="Close navigation"
        data-icon="close"
      ></button
      ><a class="brand" href="#board"
        ><img src="/assets/mark.svg" alt="" width="38" height="38" /><span
          >fix my city<span class="brand-sub">Better streets, together.</span></span
        ></a
      >
      <div class="service-area"><span class="service-dot"></span>Mumbai</div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="local-note">
          <span class="local-note-icon" data-icon="people"></span
          ><strong>Your neighbourhood.<br />Our shared responsibility.</strong>
          <p>One report can make a difference.</p>
        </div>
        <div id="account"></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button
          id="menu"
          class="icon-button mobile-only"
          aria-label="Toggle navigation"
          aria-expanded="false"
          data-icon="menu"
        ></button
        ><span class="top-title"
          ><span id="workspace-label">Community / </span
          ><b id="page-label">Overview</b></span
        >
        <div class="top-actions">
          <a
            href="#notifications"
            class="icon-button notification-link"
            aria-label="Notifications"
            ><span data-icon="bell"></span><span id="unread" hidden></span></a
          ><span id="report-action"></span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>Fix My City · Mumbai</span
        ><span>Local demonstration · Sample reports are fictional</span>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
